services:
  - type: web
    name: Vivah-Venus-5
    runtime: node
    region: oregon
    plan: free
    branch: render-postgres-test
    rootDir: render-test
    autoDeployTrigger: "off"
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vivah-venus-test-db
          property: connectionString
      - key: VIVAH_TEST_ACCESS_KEY
        generateValue: true
      - key: VIVAH_IMPORT_TOKEN
        sync: false
databases:
  - name: vivah-venus-test-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []
